<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Fox Hollow Shot Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<style>
:root {
  --bg: #f4f5f1;
  --panel: #ffffff;
  --ink: #1d2419;
  --muted: #646d5f;
  --line: #dfe3da;
  --accent: #2f6f3e;
  --accent-ink: #ffffff;
  --chip: #eef1ea;
  --shot: #ffd23f;
  --pen: #d64545;
  --good: #2f8f4e;
  --bad: #b5463c;
  --under: #c0392b;
  --over: #2c5aa0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121510; --panel: #1a1e17; --ink: #e7ebe2; --muted: #9aa392; --line: #2c3328;
    --accent: #5fae6f; --accent-ink: #0f140d; --chip: #252b21; --good: #6cc685; --bad: #e07a6f;
    --under: #ff7b6b; --over: #7fa8ea;
  }
}
:root[data-theme="dark"] {
  --bg: #121510; --panel: #1a1e17; --ink: #e7ebe2; --muted: #9aa392; --line: #2c3328;
  --accent: #5fae6f; --accent-ink: #0f140d; --chip: #252b21; --good: #6cc685; --bad: #e07a6f;
  --under: #ff7b6b; --over: #7fa8ea;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100dvh; overflow: hidden;
}
button, select, input { font: inherit; color: inherit; }
button {
  background: var(--chip); border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; cursor: pointer; min-height: 40px;   /* big enough to hit outdoors, one-handed */
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select, input[type="text"], input[type="date"] {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; min-width: 0; min-height: 40px;
}

/* Header */
.top {
  --px: 16px; --py: 8px;
  display: flex; align-items: center; gap: 12px;
  /* Keep clear of the notch / rounded corners when the phone is turned or the page is installed. */
  padding: calc(var(--py) + env(safe-area-inset-top, 0px)) max(var(--px), env(safe-area-inset-right, 0px)) var(--py) max(var(--px), env(safe-area-inset-left, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; margin-right: auto; }
.brand b { font-size: 16px; }
.brand span { color: var(--muted); font-size: 12px; }
.round-ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
#roundSel { max-width: 260px; text-overflow: ellipsis; }
.menu { position: relative; }
.menu summary { list-style: none; cursor: pointer; padding: 0 10px; min-width: 44px; min-height: 40px; display: grid; place-items: center;
  border: 1px solid var(--line); border-radius: 8px; background: var(--chip); }
.menu summary::-webkit-details-marker { display: none; }
.menu > div {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: grid; gap: 4px; min-width: 240px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18);
}
.menu > div button { text-align: left; background: transparent; border-color: transparent; min-height: 44px; }
.menu > div button:hover { background: var(--chip); }
.menu .danger { color: var(--bad); }
.menu .fld { display: grid; gap: 3px; padding: 2px 4px; font-size: 12px; color: var(--muted); }
.menu .fld input { width: 100%; color: var(--ink); font-size: 16px; }   /* 16px stops iOS zooming in on focus */
.menu hr { width: 100%; margin: 4px 0; border: 0; border-top: 1px solid var(--line); }

/* Layout */
.app { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: #2b3a26; }
#panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) 16px; }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 52dvh minmax(0, 1fr); }
  #panel { border-left: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .brand span { display: none; }
  .top { gap: 6px; --px: 12px; --py: 6px; }
  .brand { margin-right: 0; }
  .round-ctl { flex: 1 1 100%; flex-wrap: nowrap; }
  #roundSel { flex: 1 1 0; width: 0; max-width: none; }
  .mapctl { gap: 4px; }
  .mapctl button { padding: 0 8px; font-size: 13px; }
  .mapctl .long { display: none; }
  .maphole { bottom: 22px; }
}

/* Map overlay controls */
.mapctl { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); z-index: 5; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 20px); }
.mapctl button { background: rgba(20,24,18,.78); color: #fff; border-color: rgba(255,255,255,.18); backdrop-filter: blur(4px); min-height: 44px; }
.mapctl button.on { background: #ffd23f; color: #1d2419; border-color: #ffd23f; }
.maphole { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 2px; align-items: center;
  background: rgba(20,24,18,.78); color: #fff; padding: 2px; border-radius: 999px; backdrop-filter: blur(4px); }
.maphole button { background: transparent; color: #fff; border: 0; padding: 0; min-width: 44px; min-height: 44px; font-size: 20px; border-radius: 999px; }
.maphole button:hover { background: rgba(255,255,255,.12); }
.maphole span { min-width: 92px; text-align: center; font-weight: 600; }
/* Messages sit above the hole switcher, away from the green at the top of the map. */
.toast { position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%); z-index: 6; background: rgba(20,24,18,.9); color: #fff;
  padding: 8px 14px; border-radius: 8px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
/* A toast with a button (Undo) can be tapped while it shows. */
.toast.act.show { pointer-events: auto; display: flex; align-items: center; gap: 4px; padding: 2px 4px 2px 14px; white-space: nowrap; }
.toast button { background: transparent; border: 0; color: #ffd23f; font-weight: 700; min-height: 44px; padding: 0 12px; }

/* Map markers. Each one sits in a 44px touch area (.mk) so it is easy to grab; the visible part is its child. */
.mk { cursor: grab; width: 44px; height: 44px; display: grid; place-items: center; }
.mk.pin { place-items: end start; padding-left: 18px; }   /* puts the flagstick on the centre line */
.mk.holeno { cursor: pointer; }
.mk-ball { width: 22px; height: 22px; border-radius: 50%; background: var(--shot); color: #1d2419; border: 2px solid #fff;
  display: grid; place-items: center; font: 700 11px/1 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.mk-ball.pen { border-color: var(--pen); box-shadow: 0 0 0 2px var(--pen), 0 1px 4px rgba(0,0,0,.5); }
.mk-ball.last { width: 26px; height: 26px; font-size: 12px; }
.mk-tee { width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #1d2419; border: 2px solid #1d2419;
  display: grid; place-items: center; font: 800 10px/1 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.mk-pin { width: 22px; height: 30px; position: relative; }
.mk-pin::before { content: ""; position: absolute; left: 3px; bottom: 0; width: 2px; height: 30px; background: #fff; box-shadow: 0 0 2px rgba(0,0,0,.7); }
.mk-pin::after { content: ""; position: absolute; left: 5px; top: 0; border-left: 15px solid #e8402f; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
.mk-label { pointer-events: none; background: rgba(20,24,18,.82); color: #fff; padding: 1px 6px; border-radius: 999px; font: 600 11px/1.5 system-ui, sans-serif; white-space: nowrap; }
.mk-holeno { cursor: pointer; width: 24px; height: 24px; border-radius: 50%; background: #fff; color: #1d2419; border: 2px solid #1d2419;
  display: grid; place-items: center; font: 800 11px/1 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.5); }
.mk-holeno.played { background: var(--shot); }

/* Panel */
.holenav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin-bottom: 8px; }
.holenav h2 { margin: 0; font-size: 22px; text-align: center; }
.holenav p { margin: 0; text-align: center; color: var(--muted); }
.holenav button { font-size: 20px; padding: 0; min-width: 44px; min-height: 44px; }
.hint { background: var(--chip); border-radius: 8px; padding: 8px 10px; color: var(--muted); margin: 8px 0 12px; font-size: 13px; }
.section-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.shots { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.shots li { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.shots .n { width: 22px; height: 22px; border-radius: 50%; background: var(--shot); color: #1d2419; font-weight: 700; font-size: 11px; display: grid; place-items: center; }
.shots .l1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.shots .l2 { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.shots select { padding: 2px 4px; font-size: 14px; }
.shots button { padding: 0 6px; font-size: 14px; min-width: 44px; min-height: 44px; }
.shots button.pen.on { background: var(--pen); color: #fff; border-color: var(--pen); }
.lie { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--chip); border: 1px solid var(--line); }
.lie-fairway { background: #d8f0cf; color: #24521c; border-color: #b9e0aa; }
.lie-green { background: #c9f0be; color: #1b5a12; border-color: #a5e295; }
.lie-bunker { background: #f4e7c2; color: #6b5517; border-color: #e6d49c; }
.lie-water { background: #cfe2f7; color: #1c4a7d; border-color: #a9c9ee; }
.lie-rough { background: #e3e8dc; color: #45503d; }
.lie-off { background: #f6d5d1; color: #7a231a; border-color: #eab3ac; }
.empty { color: var(--muted); font-size: 13px; padding: 6px 0; }
.btnrow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.putts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.putts button { min-height: 48px; padding: 0; font-size: 18px; font-weight: 700; }
.putts button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.putts.ask { outline: 2px solid var(--shot); outline-offset: 4px; border-radius: 8px; }
.note { color: var(--muted); font-size: 12px; margin-top: 6px; }
.next { width: 100%; min-height: 48px; margin-top: 10px; font-size: 16px; font-weight: 600; }
.result { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 4px; }
.stat { background: var(--chip); border-radius: 10px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 18px; }
.stat span { color: var(--muted); font-size: 11px; }
.yes { color: var(--good); } .no { color: var(--bad); }

/* Scorecard */
.sc { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; margin-bottom: 8px; }
.sc th, .sc td { border: 1px solid var(--line); text-align: center; padding: 3px 0; }
.sc th:first-child { width: 44px; text-align: left; padding-left: 4px; color: var(--muted); font-weight: 500; }
.sc .tot { font-weight: 700; background: var(--chip); width: 34px; }
.sc .hn { cursor: pointer; height: 36px; }
.sc .hn:hover { background: var(--chip); }
.sc .cur { background: var(--shot) !important; color: #1d2419; }
.sc .s { display: inline-grid; place-items: center; width: 20px; height: 20px; }
.sc .s.birdie { border: 1.5px solid var(--under); border-radius: 50%; color: var(--under); }
.sc .s.eagle { border: 1.5px solid var(--under); border-radius: 50%; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--under); color: var(--under); }
.sc .s.bogey { border: 1.5px solid var(--over); color: var(--over); }
.sc .s.double { border: 1.5px solid var(--over); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3.5px var(--over); color: var(--over); }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.clubs { width: 100%; border-collapse: collapse; font-size: 13px; }
.clubs td, .clubs th { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.clubs td:first-child, .clubs th:first-child { text-align: left; }
.clubs th { color: var(--muted); font-weight: 500; font-size: 12px; }
.foot { color: var(--muted); font-size: 11px; margin-top: 20px; }
.group { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; text-decoration: none; color: inherit;
  background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; }
.group > div { flex: 1; min-width: 0; display: grid; }
.group span { color: var(--muted); font-size: 12px; }
.group .go { color: var(--accent); font-weight: 600; font-size: 13px; }
.group.on { border-color: var(--accent); }
.group.on a { color: var(--accent); font-weight: 600; font-size: 13px; }
.group.on button { padding: 0; min-width: 44px; min-height: 44px; }
.warn { color: var(--bad); font-size: 12px; margin-top: 6px; }
.gread small.warn { color: var(--bad); margin: 0; }
.gread { background: var(--chip); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
.gread p { margin: 0; }
.gread .putt { font-size: 15px; }
.gread small { color: var(--muted); font-size: 12px; }
.gread .caddy { font-size: 15px; background: var(--panel); border-radius: 8px; padding: 8px 10px; border-left: 4px solid var(--shot); }
.gread .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.gread .seg button small { color: inherit; opacity: .7; font-size: 12px; }
.gread button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mk-ball.temp { background: #fff; }
.ramp { display: inline-block; width: 64px; height: 8px; border-radius: 4px; vertical-align: middle; margin: 0 4px;
  background: linear-gradient(90deg, #2c7bb6, #abd9e9, #ffffbf, #fdae61, #d7191c); }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Fox Hollow Golf Club</b><span>Branchburg, NJ · round shot map</span></div>
  <div class="round-ctl">
    <select id="roundSel" aria-label="Round"></select>
    <button id="newRound" class="primary">New round</button>
    <details class="menu" id="menu">
      <summary aria-label="Round name, date and more">⋯</summary>
      <div>
        <label class="fld">Round name<input type="text" id="rName" placeholder="e.g. Saturday w/ Dad" autocomplete="off"></label>
        <label class="fld">Date<input type="date" id="rDate"></label>
        <hr>
        <button data-menu="group">Group scorecard (live) ↗</button>
        <button data-menu="export">Export rounds (JSON)</button>
        <button data-menu="import">Import rounds…</button>
        <button data-menu="delete" class="danger">Delete this round</button>
      </div>
    </details>
  </div>
</header>
<main class="app">
  <div class="mapwrap">
    <div id="map"></div>
    <div class="mapctl">
      <button id="viewBtn">All holes</button>
      <button id="styleBtn">Diagram</button>
      <button id="locBtn" title="Add a shot at your current GPS position">📍 Ball is here</button>
      <button id="greenBtn" title="Zoom in on the green and show its slopes">⛳ Green</button>
    </div>
    <div class="maphole" id="mapHole">
      <button data-act="prev" aria-label="Previous hole">‹</button>
      <span id="mapHoleLbl"></span>
      <button data-act="next" aria-label="Next hole">›</button>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <aside id="panel"></aside>
</main>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script src="course-data.js"></script>
<script src="green-data.js"></script>
<script>
"use strict";
const COURSE = window.COURSE;
const HOLES = {};
COURSE.holes.forEach(h => { HOLES[h.number] = h; });
const FEATURES = COURSE.features.features;
const CLUBS = ["", "Driver", "3W", "5W", "7W", "Hybrid", "3i", "4i", "5i", "6i", "7i", "8i", "9i", "PW", "GW", "SW", "LW", "Putter"];
const STORE_KEY = "foxhollow.rounds.v1";
const YD = 0.9144;
const R2D = 180 / Math.PI, D2R = Math.PI / 180;

/* ---------- geometry ---------- */
function meters(a, b) {
  const R = 6371008.8, p1 = a[1] * D2R, p2 = b[1] * D2R;
  const dp = p2 - p1, dl = (b[0] - a[0]) * D2R;
  const h = Math.sin(dp / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const yards = (a, b) => meters(a, b) / YD;
function bearing(a, b) {
  const p1 = a[1] * D2R, p2 = b[1] * D2R, dl = (b[0] - a[0]) * D2R;
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Math.atan2(y, x) * R2D + 360) % 360;
}
function inRing(p, r) {
  let c = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < (xj - xi) * (p[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function polysOf(g) {
  return g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
}
function inGeom(p, g) {
  return polysOf(g).some(rings => inRing(p, rings[0]) && !rings.slice(1).some(h => inRing(p, h)));
}
function coordsOf(g) {
  const out = [];
  (function walk(c) { typeof c[0] === "number" ? out.push(c) : c.forEach(walk); })(g.coordinates);
  return out;
}
// Polygon index with bounding boxes for quick lie lookups.
const POLYS = FEATURES.filter(f => /Polygon/.test(f.geometry.type)).map(f => {
  const cs = coordsOf(f.geometry);
  const xs = cs.map(c => c[0]), ys = cs.map(c => c[1]);
  return { f, k: f.properties.kind, holes: f.properties.holes || [], bb: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] };
});
const COURSE_POLY = POLYS.find(p => p.k === "course");
function hits(p, kind) {
  return POLYS.filter(x => x.k === kind && p[0] >= x.bb[0] && p[0] <= x.bb[2] && p[1] >= x.bb[1] && p[1] <= x.bb[3] && inGeom(p, x.f.geometry));
}
/** Where did the ball finish? Returns {k, label, own} */
function lieAt(p, n) {
  const g = hits(p, "green");
  if (g.length) return g.some(x => x.holes.includes(n)) ? { k: "green", label: "Green", own: true } : { k: "green", label: "Wrong green", own: false };
  if (hits(p, "practice_green").length) return { k: "green", label: "Practice green", own: false };
  if (hits(p, "bunker").length) return { k: "bunker", label: "Bunker" };
  if (hits(p, "water").length) return { k: "water", label: "Water" };
  const fw = hits(p, "fairway");
  if (fw.length) {
    const own = fw.some(x => x.holes.includes(n));
    return { k: "fairway", label: own ? "Fairway" : "Fairway (hole " + fw[0].holes.join("/") + ")", own };
  }
  if (hits(p, "tee").length) return { k: "rough", label: "Tee box" };
  if (COURSE_POLY && !inGeom(p, COURSE_POLY.f.geometry)) return { k: "off", label: "Off course" };
  return { k: "rough", label: "Rough" };
}

/* ---------- state ---------- */
let saveOk = true;
function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && Array.isArray(s.rounds)) return s; } catch (e) {}
  return { rounds: [], cur: null };
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); saveOk = true; } catch (e) { saveOk = false; }
  syncGroup();
}

/* ---------- link to a live group round (group/index.html) ----------
   Both pages live on the same site, so they share browser storage: the group
   page records which rounds you joined (fhg.rooms / fhg.meta / fhg.me.<code>).
   Finished hole scores are added to that round's outbox (fhg.out.<code>) in the
   group page's own message format and sent through the same relay. */
const RELAY = "https://ntfy.sh/", G_PREFIX = "fhgolf-";

function gradAt(g, p) {
  const h = 0.75, dlon = h / KX, dlat = h / KY;
  return [(elevAt(g, [p[0] + dlon, p[1]]) - elevAt(g, [p[0] - dlon, p[1]])) / (2 * h),
          (elevAt(g, [p[0], p[1] + dlat]) - elevAt(g, [p[0], p[1] - dlat])) / (2 * h)];
}
const offset = (p, east, north) => [p[0] + east / KX, p[1] + north / KY];
const greenCache = {};
/** Everything the green view draws for hole n, worked out once. */
function greenInfo(n) {
  if (greenCache[n] !== undefined) return greenCache[n];
  const g = GREEN_GRID(n), gp = greenPoly(n);
  if (!g || !gp) return (greenCache[n] = null);
  const geom = gp.f.geometry, inside = p => inGeom(p, geom);
  const cellAt = (i, j) => [g.w + (i + 0.5) * g.dx, g.n - (j + 0.5) * g.dy];
  // Height range and best-fit plane over the cells on the green.
  let lo = Infinity, hi = -Infinity, sx = 0, sy = 0, sz = 0, sxx = 0, syy = 0, sxy = 0, sxz = 0, syz = 0, cnt = 0;
  const p0 = cellAt(0, 0);
  for (let j = 0; j < g.ny; j++) for (let i = 0; i < g.nx; i++) {
    const p = cellAt(i, j); if (!inside(p)) continue;
    const z = g.z[j * g.nx + i] / 100, x = (p[0] - p0[0]) * KX, y = (p[1] - p0[1]) * KY;
    lo = Math.min(lo, z); hi = Math.max(hi, z); cnt++;
    sx += x; sy += y; sz += z; sxx += x * x; syy += y * y; sxy += x * y; sxz += x * z; syz += y * z;
  }
  if (cnt < 6) return (greenCache[n] = null);
  // Solve the 3x3 normal equations for z = c + gx*x + gy*y (centred to keep it stable).
  const mx = sx / cnt, my = sy / cnt, mz = sz / cnt;
  const cxx = sxx / cnt - mx * mx, cyy = syy / cnt - my * my, cxy = sxy / cnt - mx * my;
  const cxz = sxz / cnt - mx * mz, cyz = syz / cnt - my * mz, det = cxx * cyy - cxy * cxy;
  const plane = det ? [(cxz * cyy - cyz * cxy) / det, (cyz * cxx - cxz * cxy) / det] : [0, 0];

  // Height shading, drawn on a canvas 4 px per cell and masked to the green outline.
  const S = 4, cw = g.nx * S, ch = g.ny * S, cv = document.createElement("canvas");
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(cw, ch);
  const RAMP = [[44, 123, 182], [171, 217, 233], [255, 255, 191], [253, 174, 97], [215, 25, 28]];
  const color = t => { t = Math.max(0, Math.min(1, t)) * 4; const k = Math.min(3, Math.floor(t)), f = t - k;
    return RAMP[k].map((c, q) => c + (RAMP[k + 1][q] - c) * f); };
  for (let py = 0; py < ch; py++) for (let px = 0; px < cw; px++) {
    const p = [g.w + (px + 0.5) / S * g.dx, g.n - (py + 0.5) / S * g.dy];
    if (!inside(p)) continue;
    const c = color((elevAt(g, p) - lo) / Math.max(hi - lo, 0.05)), o = (py * cw + px) * 4;
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 150;
  }
  ctx.putImageData(img, 0, 0);
  const e = g.w + g.nx * g.dx, s = g.n - g.ny * g.dy;
  const heat = { url: cv.toDataURL(), coordinates: [[g.w, g.n], [e, g.n], [e, s], [g.w, s]] };

  const features = [];
  // Contour lines (marching squares over cell centres), spaced so a green gets about a dozen.
  const rangeIn = (hi - lo) / 0.0254;
  const stepIn = [1, 2, 3, 4, 6, 12].find(v => rangeIn / v <= 12) || 12, step = stepIn * 0.0254;
  const segs = [];
  for (let j = 0; j < g.ny - 1; j++) for (let i = 0; i < g.nx - 1; i++) {
    const c = [cellAt(i, j), cellAt(i + 1, j), cellAt(i + 1, j + 1), cellAt(i, j + 1)];
    if (!inside([(c[0][0] + c[2][0]) / 2, (c[0][1] + c[2][1]) / 2])) continue;
    const z = [g.z[j * g.nx + i], g.z[j * g.nx + i + 1], g.z[(j + 1) * g.nx + i + 1], g.z[(j + 1) * g.nx + i]].map(v => v / 100);
    const zmin = Math.min(...z), zmax = Math.max(...z);
    for (let L = Math.ceil(zmin / step) * step; L <= zmax; L += step) {
      const pts = [];
      for (let k = 0; k < 4; k++) {
        const a = z[k], b = z[(k + 1) % 4];
        if ((a < L) !== (b < L)) { const t = (L - a) / (b - a), A = c[k], B = c[(k + 1) % 4]; pts.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); }
      }
      if (pts.length >= 2) segs.push([pts[0], pts[1]]);
      if (pts.length === 4) segs.push([pts[2], pts[3]]);
    }
  }
  features.push({ type: "Feature", properties: { k: "contour" }, geometry: { type: "MultiLineString", coordinates: segs } });
  // Downhill arrows on a 3.5 m grid; longer = steeper.
  const gap = 3.5, b0 = gp.bb;
  for (let y = b0[1] + gap / 2 / KY; y < b0[3]; y += gap / KY) for (let x = b0[0] + gap / 2 / KX; x < b0[2]; x += gap / KX) {
    const p = [x, y]; if (!inside(p)) continue;
    const gr = gradAt(g, p), sl = Math.hypot(gr[0], gr[1]); if (sl < 0.004) continue;
    const ux = -gr[0] / sl, uy = -gr[1] / sl, len = Math.min(2.2, 0.7 + sl * 40);
    const tail = offset(p, -ux * len / 2, -uy * len / 2), tip = offset(p, ux * len / 2, uy * len / 2);
    const head = ang => { const c = Math.cos(ang), s = Math.sin(ang); return offset(tip, -(ux * c - uy * s) * 0.55, -(ux * s + uy * c) * 0.55); };
    features.push({ type: "Feature", properties: { k: "arrow" },
      geometry: { type: "MultiLineString", coordinates: [[tail, tip], [head(0.5), tip, head(-0.5)]] } });
  }
  return (greenCache[n] = { g, heat, lines: { type: "FeatureCollection", features }, lo, hi, plane, stepIn });
}

let heatFor = null;    // which hole's shading the image layer holds
function drawGreen() {
  if (!map.getSource("green-lines")) return;
  const info = view === "hole" && greenMode ? greenInfo(holeNo) : null;
  map.getSource("green-lines").setData(info ? info.lines : emptyFC());
  if (info) {
    const src = map.getSource("green-heat");
    if (src) { if (heatFor !== holeNo) src.updateImage(info.heat); }   // only when the hole changes: a reload mid-load aborts
    else {
      map.addSource("green-heat", { type: "image", ...info.heat });
      map.addLayer({ id: "green-heat", type: "raster", source: "green-heat", paint: { "raster-fade-duration": 0, "raster-resampling": "linear" } }, "green-contours");
    }
    heatFor = holeNo;
  }
  if (map.getLayer("green-heat")) map.setLayoutProperty("green-heat", "visibility", info ? "visible" : "none");
}

const SIDES = ["the back", "the back-right", "the right", "the front-right", "the front", "the front-left", "the left", "the back-left"];
/** Plain-words read of the green, and of the putt when your ball is on it. */
function greenRead(n) {
  const info = greenInfo(n); if (!info) return null;
  const h = HOLES[n], brg = bearing(h.line[0], h.line[h.line.length - 1]);
  const [gx, gy] = info.plane, slope = Math.hypot(gx, gy);
  const downBrg = (Math.atan2(-gx, -gy) * R2D + 360) % 360;
  const side = SIDES[Math.round(((downBrg - brg + 360) % 360) / 45) % 8];
  const out = { overall: slope < 0.005 ? "Close to flat overall" : `Slopes down toward ${side}, about ${(slope * 100).toFixed(1)}%`,
    rangeIn: Math.round((info.hi - info.lo) / 0.0254), stepIn: info.stepIn, putt: null };
  const b = puttBall(n);
  if (b) {
    const pin = pinOf(n), m = meters(b.p, pin);
    if (!inGeom(b.p, greenPoly(n).f.geometry)) out.putt = { off: true, temp: b.temp };
    else if (m > 0.3) {
      const rise = (elevAt(info.g, pin) - elevAt(info.g, b.p)) / 0.0254;
      out.putt = {
        temp: b.temp, ft: Math.round(m / 0.3048),
        rise: Math.abs(rise) < 0.5 ? "about level" : `${Math.round(Math.abs(rise))} in ${rise > 0 ? "uphill" : "downhill"}`,
        caddy: caddyRead(n, b.p)
      };
    }
  }
  return out;
}

/* ---------- caddy read: roll a ball over the green's surface ----------
   A rolling ball slows by a constant amount set by green speed (a stimpmeter
   ball leaves the ramp at 1.83 m/s and rolls S feet on flat ground), and slopes
   push it downhill at 5/7 g × slope (the 5/7 is because it rolls, not slides).
   The read finds the start line and speed that take the ball through the middle
   of the hole and, if it missed, 1.5 ft past: a firm "die it in" pace. */
const STIMPS = [[8, "Slow"], [10, "Medium"], [12, "Fast"]];
let stimp = lsGet("foxhollow.stimp", 10);
let readMode = false, readSpot = null;    // read from a spot you tap, without recording a shot
const PAST = 0.4572, CUP_IN = 4.25, G57 = 9.81 * 5 / 7;
const MAX_READ_M = 60 * 0.3048;           // past 60 ft the survey can't support a precise aim

/** Where the read starts: a spot you marked to read from, else your ball if it's on this green and the hole isn't finished. */
function puttBall(n) {
  if (readSpot) return { p: readSpot, temp: true };
  const d = hd(n); if (!d.shots.length || d.putts !== null) return null;
  const last = d.shots[d.shots.length - 1].to, lie = lieAt(last, n);
  return lie.k === "green" && lie.own ? { p: last, temp: false } : null;
}

/** Roll a putt from `ball` at angle th (radians, 0 = east, counter-clockwise) and speed v (m/s).
    Works in metres east/north of the ball. Returns how it passed the hole (hx, hy). */
function rollPutt(g, ball, hx, hy, th, v, decel, keepPath) {
  let x = 0, y = 0, vx = v * Math.cos(th), vy = v * Math.sin(th), len = 0;
  let best = Infinity, bx = 0, by = 0, dx = vx, dy = vy, lenAtBest = 0;
  const dt = 0.01, path = keepPath ? [[0, 0]] : null;
  let i = 0;
  for (; i < 4000; i++) {
    const gr = gradAt(g, offset(ball, x, y)), sp = Math.hypot(vx, vy);
    let ax = -G57 * gr[0], ay = -G57 * gr[1];
    if (sp < 0.02) {
      if (Math.hypot(ax, ay) <= decel) break;          // slope can't move it: it has stopped
    } else { ax -= decel * vx / sp; ay -= decel * vy / sp; }
    let nvx = vx + ax * dt, nvy = vy + ay * dt;
    if (sp >= 0.02 && nvx * vx + nvy * vy < 0) { nvx = 0; nvy = 0; }   // friction stops it, never turns it round
    const sx = (vx + nvx) / 2 * dt, sy = (vy + nvy) / 2 * dt, sl = Math.hypot(sx, sy);
    if (sl > 0) {   // closest pass to the hole along this little step
      const t = Math.max(0, Math.min(1, ((hx - x) * sx + (hy - y) * sy) / (sl * sl)));
      const cx = x + sx * t, cy = y + sy * t, dist = Math.hypot(hx - cx, hy - cy);
      if (dist < best) { best = dist; bx = cx; by = cy; dx = sx; dy = sy; lenAtBest = len + sl * t; }
    }
    x += sx; y += sy; len += sl; vx = nvx; vy = nvy;
    if (path && i % 3 === 0) path.push([x, y]);
  }
  if (path) path.push([x, y]);
  const dn = Math.hypot(dx, dy) || 1;
  return {
    side: (dx * (hy - by) - dy * (hx - bx)) / dn,          // > 0: the hole is left of where the ball went
    past: len - lenAtBest > 0.01 ? len - lenAtBest : -best, // how far it rolled past the hole (negative = short)
    miss: best,                                             // closest it came to the middle of the hole
    ran: i >= 4000,                                         // still rolling after 40 s: too steep to stop
    path
  };
}

const caddyCache = {};
/** Aim and pace for a putt from p to the hole on hole n, or {why} when it can't be read. */
function caddyRead(n, p) {
  const pin = pinOf(n), key = [n, p, pin, stimp].join("|");
  if (caddyCache[key]) return caddyCache[key];
  const g = GREEN_GRID(n), decel = 1.83 ** 2 / (2 * stimp * 0.3048);
  const hx = (pin[0] - p[0]) * KX, hy = (pin[1] - p[1]) * KY, D = Math.hypot(hx, hy), th0 = Math.atan2(hy, hx);
  if (D > MAX_READ_M) return (caddyCache[key] = { why: "Over 60 ft: too far for this data to give a precise aim. Go by the slopes and focus on pace." });
  const TOL = 0.01;                 // a line counts only if the roll passes within 1 cm of the middle of the hole
  let near = th0;                   // the last line found, so the next speed starts looking there
  // For a given speed, find the line that sends the ball over the middle of the hole (null: none gets there).
  // A roll that is on line but never got to the hole (stopped short, or rolled back down) counts as short by that much.
  const onLine = (th, r, v) => ({ v, th, past: r.miss < 0.03 ? r.past : -r.miss, ran: r.ran });
  const lineFor = v => {
    // Quick way: turn the line by the amount it missed. Enough on ordinary slopes.
    let th = near, r;
    for (let k = 0; k < 6 && Math.abs(th - th0) < 1.4; k++) {
      r = rollPutt(g, p, hx, hy, th, v, decel);
      if (Math.abs(r.side) < TOL) return onLine(th, r, v);
      th += Math.atan2(r.side, D);
    }
    // Steep or twisting ground: sweep the start line, and home in wherever the miss flips from the hole being
    // on the left to being on the right. A flip only counts if the roll really passes over the hole there.
    const step = 4 * D2R, spans = [];
    let prev = 0;
    for (let k = -20; k <= 20; k++) {
      const sd = rollPutt(g, p, hx, hy, th0 + k * step, v, decel).side;
      if (k > -20 && prev > 0 && sd <= 0) spans.push([th0 + (k - 1) * step, th0 + k * step]);
      prev = sd;
    }
    spans.sort((s1, s2) => Math.abs((s1[0] + s1[1]) / 2 - near) - Math.abs((s2[0] + s2[1]) / 2 - near));
    for (let [lo, hi] of spans) {
      for (let k = 0; k < 16; k++) {
        th = (lo + hi) / 2; r = rollPutt(g, p, hx, hy, th, v, decel);
        if (Math.abs(r.side) < TOL) return onLine(th, r, v);
        r.side > 0 ? lo = th : hi = th;
      }
    }
    return null;
  };
  // short: stops before the 1.5 ft mark, or no line reaches the hole at all at this speed.
  const tryV = v => { const s = lineFor(v); if (!s) return { v, short: true, miss: true }; near = s.th; s.short = s.past < PAST; return s; };
  // Then find the speed that finishes 1.5 ft past: bracket it from an energy estimate, then halve the bracket.
  let v = Math.sqrt(Math.max(0.02, 2 * decel * (D + PAST) + 2 * G57 * (elevAt(g, pin) - elevAt(g, p))));
  let lo = null, hi = null, cur = tryV(v);
  for (let k = 0; k < 40 && !(lo && hi); k++) {
    if (cur.short) { lo = cur; if (!hi) { v *= 1.15; if (v > 12) break; cur = tryV(v); } }
    else { hi = cur; if (!lo) { v *= 0.87; if (v < 0.05) break; cur = tryV(v); } }
  }
  if (!hi) return (caddyCache[key] = { why: "Couldn't find a line for this one. Trust your own read." });
  const good = s => !s.miss && Math.abs(s.past - PAST) < 0.02;
  for (let k = 0; lo && k < 22 && !good(hi) && !good(lo) && hi.v - lo.v > 2e-4; k++) {
    const mid = tryV((lo.v + hi.v) / 2);
    mid.short ? lo = mid : hi = mid;
  }
  const sol = lo && good(lo) ? lo : hi;                                // else the slowest roll that reaches the hole
  const th = sol.th; v = sol.v;
  const hot = sol.ran || Math.abs(sol.past - PAST) > 0.15;             // it can't be made to stop by the hole
  const run = rollPutt(g, p, hx, hy, th, v, decel, true);
  const dth = Math.atan2(Math.sin(th - th0), Math.cos(th - th0));
  const offIn = D * Math.sin(dth) / 0.0254;                            // > 0: aim left of the hole
  const side = offIn > 0 ? "left" : "right", a = Math.abs(offIn);
  let aim;
  if (hot && a > 6) aim = `Start it well ${side} of the hole`;         // no cup count: it would be false precision
  else if (a < 1) aim = "Aim at the middle of the hole";
  else if (a <= 2.1) aim = `Aim inside the ${side} edge`;
  else if (a <= 3.5) aim = `Aim at the ${side} edge`;
  else if (a <= 36) {
    const cups = Math.max(0.5, Math.round((a - CUP_IN / 2) / CUP_IN * 2) / 2);
    aim = `Aim ${String(cups).replace(".5", "½")} cup${cups > 1 ? "s" : ""} outside the ${side} edge (${Math.round(a)} in ${side} of the hole)`;
  } else aim = `Aim about ${(a / 12).toFixed(1).replace(".0", "")} ft ${side} of the hole`;
  const pastFt = Math.round(sol.past / 0.3048);
  const note = hot ? `Too steep here, on this data, for a putt to stop by the hole: a miss runs ${sol.ran || pastFt > 25 ? "a long way" : "about " + pastFt + " ft"} past. The line is the slowest one that gets there, so take it as a rough picture.`
    : Math.abs(dth) > 20 * D2R ? "That is a very big break. Either the slope really is severe or the survey is off here, so trust your eyes." : "";
  const playsFt = Math.round((v * v / (2 * decel) - PAST) / 0.3048), ft = Math.round(D / 0.3048);
  return (caddyCache[key] = {
    aim, hot, note, breaks: a < 1 ? "straight" : offIn > 0 ? "left to right" : "right to left",
    playsFt, ft, path: run.path.map(([x, y]) => offset(p, x, y)), aimPt: offset(p, D * Math.cos(th), D * Math.sin(th))
  });
}

function drawPutt() {
  if (!map.getSource("putt")) return;
  const r = view === "hole" && greenMode ? greenRead(holeNo) : null, c = r && r.putt && r.putt.caddy;
  const b = puttBall(holeNo), fc = emptyFC();
  if (c && c.path && b) {
    fc.features.push({ type: "Feature", properties: { k: "aim" }, geometry: { type: "LineString", coordinates: [b.p, c.aimPt] } });
    fc.features.push({ type: "Feature", properties: { k: "path" }, geometry: { type: "LineString", coordinates: c.path } });
    fc.features.push({ type: "Feature", properties: { k: "aimpt" }, geometry: { type: "Point", coordinates: c.aimPt } });
  }
  map.getSource("putt").setData(fc);
}

function greenHTML(n) {
  const r = greenRead(n);
  if (!r) return `<div class="gread"><p>No slope data for this green.</p></div>`;
  const P = r.putt, c = P && P.caddy;
  let read;
  if (!P) read = `<p class="putt">Tap where your ball is on the green, or use the button below, for a caddy read.</p>`;
  else if (P.off) read = `<p class="putt">That spot is off the green. Tap a spot on the green to read the putt.</p>`;
  else read = `<p class="putt"><b>${P.temp ? "From your spot" : "Your putt"}:</b> ${P.ft} ft · ${P.rise}</p>
    ${c && c.aim ? `<p class="caddy"><b>${c.aim}.</b><br>${c.hot ? "Pace: as soft as you can." : `Pace: hit it like a ${c.playsFt} ft putt on flat ground${
      Math.abs(c.playsFt - c.ft) >= Math.max(2, c.ft * 0.1) ? ` (it plays ${c.playsFt > c.ft ? "longer" : "shorter"} than ${c.ft} ft)` : ""}.`}
      ${c.breaks === "straight" ? "Holds its line." : `Breaks ${c.breaks}.`}<br>${c.note ? `<small class="warn">${c.note}</small><br>` : ""}<small>Yellow line: how it should roll · white dot: aim point</small></p>`
      : c ? `<p class="caddy">${c.why}</p>` : ""}`;
  return `<div class="gread">
    ${read}
    <div class="seg" role="group" aria-label="Green speed">${STIMPS.map(([s, l]) =>
      `<button data-stimp="${s}" class="${s === stimp ? "on" : ""}">${l} <small>${s}</small></button>`).join("")}</div>
    <button data-act="readspot" class="${readMode ? "on" : ""}">${readMode ? "Done reading — taps add shots again" : "Read from a spot (doesn't add a shot)"}</button>
    <p>${r.overall} · ${r.rangeIn} in from highest to lowest point.</p>
    <small>Low<span class="ramp"></span>high · arrows point downhill (longer = steeper) · lines every ${r.stepIn} in of height</small>
    <small>A guide, read it yourself too. The slopes come from a USGS lidar survey (about 1 m resolution, a few years old) and the green speed is a guess: good for the main slopes, may miss small breaks.</small>
  </div>`;
}

/* ---------- interactions ---------- */
map.on("click", e => {
  if (e.originalEvent && e.originalEvent.target.closest && e.originalEvent.target.closest(".mk")) return;
  mapTap([e.lngLat.lng, e.lngLat.lat]);
});
function mapTap(p) {
  if (view !== "hole") return;
  if (greenMode && readMode) { setReadSpot(p); return; }
  const d = hd(holeNo, true);
  // Before the first shot, tapping one of this hole's tee boxes sets where you teed off.
  if (!d.shots.length && hits(p, "tee").some(x => x.holes.includes(holeNo))) {
    d.start = p; save(); render(); toast("Tee set — now tap where your tee shot finished"); return;
  }
  addShot(p);
}
function addShot(p) {
  const d = hd(holeNo, true);
  d.shots.push({ to: p, club: "", pen: 0 });
  const lie = lieAt(p, holeNo);
  save(); render();
  const dist = Math.round(yards(pointsOf(holeNo).slice(-2)[0], p));
  toast(`Shot ${d.shots.length}: ${dist} yds · ${lie.label}` + (lie.k === "water" ? " — tap +1 if you took a drop" : "") + (lie.own && lie.k === "green" ? " — add your putts" : ""));
}
function setReadSpot(p) {
  readSpot = p; render();
  toast(inGeom(p, greenPoly(holeNo).f.geometry) ? "Reading from here (not added as a shot)" : "That's off the green: tap a spot on the green");
}
function leaveGreen() { greenMode = false; readMode = false; readSpot = null; }
function setView(v) {
  view = v; leaveGreen();
  document.getElementById("viewBtn").classList.toggle("on", v === "overview");
  document.getElementById("viewBtn").textContent = v === "overview" ? "Back to hole " + holeNo : "All holes";
  document.getElementById("panel").scrollTop = 0;
  render(true);
}
function goHole(n) { holeNo = ((n - 1 + 18) % 18) + 1; if (view !== "hole") view = "hole"; setView("hole"); }

let toastTimer;
/** Short message over the map. `action` ({label, fn}) adds a button, e.g. Undo, and keeps it up longer. */
function toast(msg, action) {
  const t = document.getElementById("toast");
  const hide = () => { t.classList.remove("show", "act"); };
  t.textContent = msg;
  t.classList.toggle("act", !!action);
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.onclick = () => { clearTimeout(toastTimer); hide(); action.fn(); };
    t.appendChild(b);
  }
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(hide, action ? 7000 : 2600);
}

document.getElementById("viewBtn").onclick = () => setView(view === "hole" ? "overview" : "hole");
document.getElementById("styleBtn").onclick = () => { mapStyle = mapStyle === "sat" ? "diagram" : "sat"; styleMap(); };
document.getElementById("locBtn").onclick = () => {
  if (view !== "hole") { toast("Pick a hole first"); return; }
  if (!navigator.geolocation) { toast("Location isn't available in this browser"); return; }
  toast("Getting your location…");
  navigator.geolocation.getCurrentPosition(pos => {
    const p = [pos.coords.longitude, pos.coords.latitude];
    if (meters(p, pinOf(holeNo)) > 3000) { toast("You don't seem to be at Fox Hollow — shot not added"); return; }
    if (greenMode && readMode) setReadSpot(p); else addShot(p);
  }, err => toast("Couldn't get location: " + err.message), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
};
document.getElementById("greenBtn").onclick = () => {
  if (view !== "hole") { toast("Pick a hole first"); return; }
  if (!greenMode && !greenInfo(holeNo)) { toast("No slope data for this green"); return; }
  if (greenMode) leaveGreen(); else greenMode = true;
  render(true);
  if (greenMode) document.getElementById("panel").scrollTop = 0;
};
document.getElementById("mapHole").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (view !== "hole") { setView("hole"); return; }
  goHole(holeNo + (b.dataset.act === "next" ? 1 : -1));
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "ArrowRight") goHole(holeNo + 1);
  if (e.key === "ArrowLeft") goHole(holeNo - 1);
});

// Round controls
const roundSel = document.getElementById("roundSel");
function roundLabel(r) {
  const prev = round; round = r; const st = roundStats(); round = prev;
  const sc = st.played ? ` · ${st.score} (${fmtDiff(st.score - st.par)}) thru ${st.played}` : st.started ? " · in progress" : " · not started";
  return (r.date || "No date") + (r.name ? " – " + r.name : "") + sc;
}
// The round's name and date live in the ⋯ menu, out of the way of scoring.
const rName = document.getElementById("rName"), rDate = document.getElementById("rDate");
function fillRounds() {
  roundSel.innerHTML = "";
  store.rounds.forEach(r => { const o = document.createElement("option"); o.value = r.id; o.textContent = roundLabel(r); roundSel.appendChild(o); });
  roundSel.value = round.id;
  if (rName.value !== (round.name || "")) rName.value = round.name || "";
  if (rDate.value !== (round.date || "")) rDate.value = round.date || "";
}
rName.oninput = () => { round.name = rName.value; save(); fillRounds(); };
rDate.onchange = () => { round.date = rDate.value; save(); fillRounds(); };
rName.onkeydown = e => { if (e.key === "Enter") document.getElementById("menu").open = false; };
roundSel.onchange = () => { round = store.rounds.find(r => r.id === roundSel.value); store.cur = round.id; save(); holeNo = 1; setView("hole"); };
document.getElementById("newRound").onclick = () => { round = newRound(); holeNo = 1; setView("hole"); toast("New round started — tap a tee box on hole 1. Name it under ⋯"); };
document.getElementById("menu").addEventListener("click", e => {
  const b = e.target.closest("[data-menu]"); if (!b) return;
  document.getElementById("menu").open = false;
  const act = b.dataset.menu;
  if (act === "group") { location.href = "group/"; return; }
  if (act === "export") {
    const blob = new Blob([JSON.stringify({ course: COURSE.name, exported: new Date().toISOString(), rounds: store.rounds }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `fox-hollow-rounds-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  } else if (act === "import") {
    document.getElementById("importFile").click();
  } else if (act === "delete") {
    if (!confirm(`Delete the round "${roundLabel(round)}"? This can't be undone unless you exported it.`)) return;
    store.rounds = store.rounds.filter(r => r.id !== round.id);
    round = store.rounds[0] || newRound(); store.cur = round.id; save(); holeNo = 1; setView("hole");
  }
});
document.getElementById("importFile").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const incoming = Array.isArray(data) ? data : data.rounds;
    if (!Array.isArray(incoming)) throw new Error("no rounds in file");
    let added = 0, updated = 0;
    incoming.forEach(r => {
      if (!r || !r.id || typeof r.holes !== "object") return;
      const i = store.rounds.findIndex(x => x.id === r.id);
      if (i >= 0) { store.rounds[i] = r; updated++; } else { store.rounds.push(r); added++; }
    });
    store.rounds.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    save(); fillRounds(); render();
    toast(`Imported ${added} new, ${updated} updated round(s)`);
  } catch (err) { toast("Couldn't import: " + err.message); }
};

/* ---------- panel ---------- */
const panel = document.getElementById("panel");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDiff = d => d === 0 ? "E" : (d > 0 ? "+" + d : String(d));
const mark = v => v === null ? "—" : v ? '<span class="yes">✓</span>' : '<span class="no">✗</span>';

function scorecardHTML() {
  const half = (from, label) => {
    let hn = "", par = "", sc = "", pt = 0, st = 0, any = false;
    for (let n = from; n < from + 9; n++) {
      const s = holeStats(n), cur = view === "hole" && n === holeNo ? " cur" : "";
      hn += `<td class="hn${cur}" data-hole="${n}">${n}</td>`;
      par += `<td>${HOLES[n].par}</td>`;
      pt += HOLES[n].par;
      if (s) {
        // Strokes so far show as "3…"; only a finished hole counts in the total and earns a birdie/bogey mark.
        if (s.finished) { any = true; st += s.score; }
        const cls = !s.finished ? "" : s.diff <= -2 ? "eagle" : s.diff === -1 ? "birdie" : s.diff === 1 ? "bogey" : s.diff >= 2 ? "double" : "";
        sc += `<td class="hn" data-hole="${n}"><span class="s ${cls}">${s.score}${s.finished ? "" : "…"}</span></td>`;
      } else sc += `<td class="hn" data-hole="${n}"></td>`;
    }
    return `<table class="sc"><tr><th>Hole</th>${hn}<td class="tot">${label}</td></tr>
      <tr><th>Par</th>${par}<td class="tot">${pt}</td></tr>
      <tr><th>Score</th>${sc}<td class="tot">${any ? st : ""}</td></tr></table>`;
  };
  return half(1, "Out") + half(10, "In");
}

function renderHolePanel() {
  const n = holeNo, h = HOLES[n], d = hd(n), st = holeStats(n), rows = shotRows(n);
  const fromTee = Math.round(yards(startOf(n), pinOf(n)));
  const lastLie = rows.length ? rows[rows.length - 1].lie : null;
  const onGreen = lastLie && lastLie.k === "green" && lastLie.own;
  let hint;
  if (!rows.length) hint = "Tap the tee box you played from (or drag the <b>T</b>), then tap the map where each shot finished. Drag the flag to today's pin.";
  else if (onGreen && d.putts === null) hint = greenMode ? "On the green — tap how many putts you took."
    : "On the green — tap <b>⛳ Green</b> on the map to read the putt, then tap how many putts you took.";
  else if (d.putts !== null) hint = "Hole done. Drag any ball to fix its spot.";
  else hint = `Tap where shot ${rows.length + 1} finished. ${Math.round(rows[rows.length - 1].toPin)} yds to the pin.`;

  const shotsHTML = rows.length ? rows.map(r => `
    <li>
      <span class="n">${r.i + 1}</span>
      <div>
        <div class="l1">
          <select data-club="${r.i}" aria-label="Club for shot ${r.i + 1}">${CLUBS.map(c => `<option value="${c}"${c === r.s.club ? " selected" : ""}>${c || "Club…"}</option>`).join("")}</select>
          <b>${Math.round(r.dist)} yds</b>
        </div>
        <div class="l2"><span class="lie lie-${r.lie.k}">${esc(r.lie.label)}</span>${r.lie.k === "green" && r.lie.own ? Math.round(r.toPin * 3) + " ft to pin" : Math.round(r.toPin) + " yds to pin"}</div>
      </div>
      <button class="pen${r.s.pen ? " on" : ""}" data-pen="${r.i}" title="Penalty strokes (tap to cycle 0/1/2)">${r.s.pen ? "+" + r.s.pen : "+0"}</button>
      <button data-del="${r.i}" aria-label="Delete shot ${r.i + 1}">✕</button>
    </li>`).join("") : `<li style="display:block;border:0;padding:0"><div class="empty">No shots yet on this hole.</div></li>`;

  // One tap per putt count. The last button starts at 5 and adds one each tap, for the bad days.
  const many = d.putts !== null && d.putts > 4;
  const puttBtns = [0, 1, 2, 3, 4].map(v =>
    `<button data-putt="${v}" class="${d.putts === v ? "on" : ""}" aria-pressed="${d.putts === v}" aria-label="${v} putt${v === 1 ? "" : "s"}">${v}</button>`).join("")
    + `<button data-putt="more" class="${many ? "on" : ""}" aria-pressed="${many}" aria-label="${many ? d.putts + " putts, tap to add one" : "5 or more putts"}">${many ? d.putts : "5+"}</button>`;

  // Putts sit above the shot list: they are what finishes a hole, and the panel is short on a phone.
  panel.innerHTML = `
    <div class="holenav">
      <button data-act="prev" aria-label="Previous hole">‹</button>
      <div><h2>Hole ${n}</h2><p>Par ${h.par} · ${fromTee} yds from your tee${h.handicap ? " · HCP " + h.handicap : ""}</p></div>
      <button data-act="next" aria-label="Next hole">›</button>
    </div>
    ${greenMode ? "" : `<div class="hint">${hint}</div>`}
    ${greenMode ? `<div class="section-h">Green slope</div>${greenHTML(n)}` : ""}
    <div class="section-h">Putts</div>
    <div class="putts${onGreen && d.putts === null ? " ask" : ""}" role="group" aria-label="Putts on hole ${n}">${puttBtns}</div>
    ${d.putts === null ? '<div class="note">Tap 0 if you holed out from off the green.</div>' : `
    <button class="primary next" data-act="${n < 18 ? "next" : "summary"}">${n < 18 ? "Next: Hole " + (n + 1) : "Round summary"} ›</button>
    <div class="btnrow"><button data-act="puttclear">Clear putts</button></div>`}
    <div class="section-h">Shots</div>
    <ol class="shots">${shotsHTML}</ol>
    <div class="btnrow">
      ${rows.length ? '<button data-act="undo">Undo last shot</button>' : ""}
      ${rows.length || d.start || d.pin || d.putts !== null ? '<button data-act="clear">Clear hole</button>' : ""}
    </div>
    <div class="section-h">Hole ${n}</div>
    <div class="result">
      <div class="stat"><b>${st ? st.score + (st.finished ? "" : "…") : "—"}</b><span>${st && st.finished ? scoreName(st.score, h.par) : st ? "So far" : "Score"}</span></div>
      <div class="stat"><b>${h.par >= 4 ? mark(st ? st.fir : null) : "n/a"}</b><span>Fairway</span></div>
      <div class="stat"><b>${mark(st ? st.gir : null)}</b><span>Green in reg</span></div>
      <div class="stat"><b>${st ? st.pen : "—"}</b><span>Penalties</span></div>
    </div>
    <div class="section-h">Group round</div>
    ${groupHTML()}
    <div class="section-h">Scorecard</div>
    ${scorecardHTML()}
    ${totalsHTML()}
    ${saveOk ? "" : '<div class="warn">This browser isn\'t saving rounds (private window?). Use ⋯ → Export before closing.</div>'}
    <div class="foot">Course map © OpenStreetMap contributors · Imagery © Esri · Green slopes from USGS 3DEP lidar. Yardages are measured on the map, not from the scorecard.</div>`;
}

function totalsHTML() {
  const s = roundStats();
  if (!s.started) return "";
  return `<div class="totals">
    <div class="stat"><b>${s.played ? s.score : "—"}</b><span>${s.played ? fmtDiff(s.score - s.par) + " thru " + s.played : "No hole finished"}</span></div>
    <div class="stat"><b>${s.firN ? s.firHit + "/" + s.firN : "—"}</b><span>Fairways</span></div>
    <div class="stat"><b>${s.girN ? s.girHit + "/" + s.girN : "—"}</b><span>GIR</span></div>
  </div>`;
}

function renderOverviewPanel() {
  const s = roundStats();
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
  const clubRows = Object.entries(s.clubs).sort((a, b) => CLUBS.indexOf(a[0]) - CLUBS.indexOf(b[0]))
    .map(([c, ds]) => `<tr><td>${esc(c)}</td><td>${ds.length}</td><td>${avg(ds)}</td><td>${Math.round(Math.max(...ds))}</td></tr>`).join("");
  panel.innerHTML = `
    <div class="section-h" style="margin-top:0">Round</div>
    <div class="totals">
      <div class="stat"><b>${s.played ? s.score : "—"}</b><span>${s.played ? fmtDiff(s.score - s.par) + " thru " + s.played : "Score"}</span></div>
      <div class="stat"><b>${s.played ? s.putts : "—"}</b><span>Putts</span></div>
      <div class="stat"><b>${s.started ? s.pen : "—"}</b><span>Penalties</span></div>
      <div class="stat"><b>${s.firN ? Math.round(100 * s.firHit / s.firN) + "%" : "—"}</b><span>Fairways ${s.firN ? s.firHit + "/" + s.firN : ""}</span></div>
      <div class="stat"><b>${s.girN ? Math.round(100 * s.girHit / s.girN) + "%" : "—"}</b><span>GIR ${s.girN ? s.girHit + "/" + s.girN : ""}</span></div>
      <div class="stat"><b>${avg(s.tee) ?? "—"}</b><span>Avg tee shot (yds)</span></div>
    </div>
    <div class="section-h">Group round</div>
    ${groupHTML()}
    <div class="section-h">Scorecard</div>
    ${scorecardHTML()}
    <div class="section-h">Distance by club</div>
    ${clubRows ? `<table class="clubs"><tr><th>Club</th><th>Shots</th><th>Avg yds</th><th>Long</th></tr>${clubRows}</table>`
      : '<div class="empty">Pick a club on your shots to see how far each one went.</div>'}
    <div class="hint" style="margin-top:14px">Tap a hole number on the map or scorecard to open that hole.</div>
    ${saveOk ? "" : '<div class="warn">This browser isn\'t saving rounds (private window?). Use ⋯ → Export before closing.</div>'}
    <div class="foot">Course map © OpenStreetMap contributors · Imagery © Esri. Par per hole from OpenStreetMap — check it against the scorecard.</div>`;
}

panel.addEventListener("click", e => {
  const t = e.target.closest("button, [data-hole]"); if (!t) return;
  const d = hd(holeNo, true);
  if (t.dataset.hole) { holeNo = +t.dataset.hole; setView("hole"); return; }
  if (t.dataset.link) {
    const c = groupCandidates().find(x => x.room === t.dataset.link); if (!c) return;
    round.group = { room: c.room, me: c.me, name: lsGet("fhg.name", "you"), sent: {} };
    save(); pushGroup(round); renderPanel();
    toast("Linked. Finished holes now post to the group leaderboard.");
    return;
  }
  if (t.dataset.del != null) {
    // The ✕ sits right beside other buttons, so a deleted shot can be put back.
    const i = +t.dataset.del, n = holeNo, r = round, before = JSON.stringify(d);
    d.shots.splice(i, 1); save(); render();
    toast(`Shot ${i + 1} deleted`, { label: "Undo", fn: () => { r.holes[n] = JSON.parse(before); save(); render(); } });
    return;
  }
  if (t.dataset.stimp) { stimp = +t.dataset.stimp; lsSet("foxhollow.stimp", stimp); renderPanel(); drawPutt(); return; }
  if (t.dataset.act === "readspot") {
    readMode = !readMode; if (!readMode) readSpot = null;
    render(); if (readMode) toast("Tap the green where your ball is. Nothing is recorded.");
    return;
  }
  if (t.dataset.pen != null) { const s = d.shots[+t.dataset.pen]; s.pen = ((s.pen || 0) + 1) % 3; }
  else if (t.dataset.putt != null) {
    d.putts = t.dataset.putt === "more" ? Math.min(9, Math.max(5, (d.putts || 0) + 1)) : +t.dataset.putt;
  }
  else switch (t.dataset.act) {
    case "prev": goHole(holeNo - 1); return;
    case "next": goHole(holeNo + 1); return;
    case "summary": setView("overview"); return;
    case "undo": d.shots.pop(); break;
    case "clear": if (!confirm(`Clear everything on hole ${holeNo}?`)) return; delete round.holes[holeNo]; break;
    case "puttclear": d.putts = null; break;
    case "unlink": delete round.group; save(); renderPanel(); toast("Unlinked. Scores already posted stay on the leaderboard."); return;
    default: return;
  }
  save(); render();
});
panel.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.club != null) { hd(holeNo, true).shots[+t.dataset.club].club = t.value; save(); fillRounds(); }
});

/* ---------- render ---------- */
function renderPanel() {
  view === "hole" ? renderHolePanel() : renderOverviewPanel();
  fillRounds();
  document.getElementById("mapHoleLbl").textContent = view === "hole" ? `Hole ${holeNo} · Par ${HOLES[holeNo].par}` : "All 18 holes";
  const gb = document.getElementById("greenBtn");
  gb.classList.toggle("on", greenMode); gb.textContent = greenMode ? "⛳ Back to hole" : "⛳ Green";
}
function render(moveCamera, animate = true) {
  renderPanel();
  if (!map.getSource("shots")) return;
  styleMap();
  drawGreen(); drawPutt(); drawShotsLayer(); drawMarkers(); placeLabels();
  if (moveCamera) view === "hole" ? holeCamera(holeNo, animate) : overviewCamera(animate);
}
renderPanel();
window.addEventListener("resize", () => { clearTimeout(window.__rz); window.__rz = setTimeout(() => view === "hole" ? holeCamera(holeNo, false) : overviewCamera(false), 250); });

// Offline support (sw.js): once opened with signal, the page and the tiles you have seen load without it.
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
